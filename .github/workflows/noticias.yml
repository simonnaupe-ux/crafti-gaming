
name: Actualizar Crafti Gaming

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crafti-pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar archivos publicos
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='*.py' \
            --exclude='__pycache__/' \
            --exclude='README.md' \
            --exclude='imagenes_autorizadas.json' \
            ./ _site/

          python update_news.py --output _site/news.json
          test -s _site/index.html
          test -s _site/news.json
          ls -lah _site

      - name: Subir paquete de publicacion
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: '_site'
          retention-days: 1

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar Crafti Gaming
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
